# Netlify: import the repo and set "Base directory" to app. Everything else is read from here.
# Form settings: add VITE_FORM_ENDPOINT / VITE_CONTACT_EMAIL under Site configuration > Environment variables, then redeploy.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for fingerprinted build assets; the HTML itself is always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
