# Builds the Margin demo site (app/) and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The github-pages environment only accepts the default branch unless other branches are added
# under Settings > Environments > github-pages. Full steps: gtm/DEPLOY.md.
# Optional: set repository variables VITE_FORM_ENDPOINT, VITE_CONTACT_EMAIL,
# VITE_COLLAB_URL (live collaboration server) and VITE_AI_ENDPOINT (AI proxy)
# (Settings > Secrets and variables > Actions > Variables) to configure the sign-up form.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [margin-demo, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_COLLAB_URL: ${{ vars.VITE_COLLAB_URL }}
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
